Inheritance is a mechanism that allows us to create new classes 
on the basis of already existing classes.


Example:

class Student extends Person {
    constructor (name, age, marks) {
        super(name, age);
        this.marks = marks;
    }

    greet(){
        return "Hello Zaheer";
    }
}

let p1 = new Student("Zaheer", 20, 100);
