<!-- (Classes in JS):

1: Classes are a template for creating objects.
2: The constructor method is special method of a Class
for creating and initializing an object instance of that class.

Example:

class Person {
    constructor(name, age) {
        this.name = name;
        this.age = age;
    }
    talk(){
        console.log(`Hi my name is ${this.name}`);
    }
}

let p1 = new Person("Zaheer", 20);
let p2 = new Person("Abbas", 22);
